name: Verify desktop builds

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS Apple Silicon build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run package:mac

  windows-x64:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run package:win

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
