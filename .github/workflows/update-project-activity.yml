name: Update project activity charts

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Fetch the current Star count
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "STAR_COUNT=$(gh api repos/${{ github.repository }} --jq .stargazers_count)" >> "$GITHUB_ENV"

      - name: Generate charts
        run: node scripts/generate-project-activity.mjs --stars "$STAR_COUNT"

      - name: Upload generated charts
        uses: actions/upload-artifact@v4
        with:
          name: project-activity-charts
          path: |
            assets/commit-activity.svg
            assets/star-history.json
            assets/star-history.svg
          retention-days: 7
