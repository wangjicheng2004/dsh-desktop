name: Update project activity charts

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - assets/commit-activity.svg
      - assets/star-history.json
      - assets/star-history.svg

permissions:
  contents: write

jobs:
  update-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Fetch the current Star count
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "STAR_COUNT=$(gh api repos/u7-u7/dsh-desktop --jq .stargazers_count)" >> "$GITHUB_ENV"

      - name: Generate charts
        run: node scripts/generate-project-activity.mjs --stars "$STAR_COUNT"

      - name: Commit updated charts
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-activity.svg assets/star-history.json assets/star-history.svg
          git commit -m "chore: update project activity charts"
          git push
